name: DshPanel
options:
  bundleIdPrefix: com.egor.dshpanel
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true

targets:
  DshPanel:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Sources
      - path: SharedSources
    dependencies:
      - target: DshActivityWidget
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: dsh
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egor.dshpanel
        PRODUCT_NAME: DshPanel
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        # сборка без подписи — IPA собирается в CI без Apple-сертификата,
        # подписывает/запускает его потом LiveContainer/Feather на телефоне
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

  DshActivityWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Widget
      - path: SharedSources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: DshActivityWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egor.dshpanel.DshActivityWidget
        PRODUCT_NAME: DshActivityWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
