name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (без подписи — подпишет/запустит LiveContainer на телефоне)
        run: |
          xcodebuild archive \
            -project DshPanel.xcodeproj \
            -scheme DshPanel \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/DshPanel.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Pack .app -> .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/DshPanel.xcarchive/Products/Applications/DshPanel.app build/Payload/
          cd build
          zip -r DshPanel.ipa Payload
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: DshPanel-ipa
          path: build/DshPanel.ipa
