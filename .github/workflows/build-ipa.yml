name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # нужно, чтобы создавать GitHub Release с .ipa

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (без подписи — подпишет/запустит LiveContainer на телефоне)
        run: |
          xcodebuild archive \
            -project DshPanel.xcodeproj \
            -scheme DshPanel \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/DshPanel.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Pack .app -> .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/DshPanel.xcarchive/Products/Applications/DshPanel.app build/Payload/
          cd build
          zip -r DshPanel.ipa Payload
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: DshPanel-ipa
          path: build/DshPanel.ipa

      - name: Версия из project.yml
        id: ver
        run: |
          version=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          build=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=v$version-$build" >> "$GITHUB_OUTPUT"

      # Artifacts в Actions всегда отдаются в zip-обёртке — это ограничение самого механизма.
      # Чтобы можно было скачать голый .ipa без лишнего zip, публикуем его отдельно как
      # GitHub Release asset: по тегу версии из project.yml, файл отдаётся как есть.
      - name: Release .ipa (без zip-обёртки)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DshPanel ${{ steps.ver.outputs.tag }}
          files: build/DshPanel.ipa
          make_latest: true
